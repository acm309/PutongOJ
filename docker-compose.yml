# Local development dependencies.

name: putong-oj-dev

services:
  mongo:
    image: mongo:8.2
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - ./.dev/mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - ./.dev/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  sandbox:
    build:
      context: .
      dockerfile: apps/judger/Dockerfile.sandbox
    privileged: true
    shm_size: 256m
    ports:
      - 127.0.0.1:5050:5050
    volumes:
      - ./apps/server/data:/app/data:ro
