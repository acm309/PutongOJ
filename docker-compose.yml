# Putong OJ Docker Compose Configuration
# You should mount the data, logs and uploads directories to persist data.

services:
  putong-oj:
    build:
      context: .
    environment:
      - NODE_ENV=production
      - PTOJ_MONGODB_URL=mongodb://db:27017/oj
      - PTOJ_REDIS_URL=redis://redis:6379
    ports:
      - 3000:3000
    depends_on:
      - redis
      - db

  db:
    image: mongo:latest
    ports:
      - 27017:27017

  redis:
    image: redis:latest
    ports:
      - 6379:6379

  sandbox:
    build:
      context: .
      dockerfile: apps/judger/Dockerfile.sandbox
    privileged: true
    shm_size: 256m

  judger:
    build:
      context: .
      dockerfile: apps/judger/Dockerfile.judger
    environment:
      PTOJ_REDIS_URL: redis://redis:6379
      PTOJ_SANDBOX_ENDPOINT: http://sandbox:5050
